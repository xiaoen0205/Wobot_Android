name: App CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/app-ci.yml
  pull_request:
    paths:
      - app/**
      - .github/workflows/app-ci.yml

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.6" # the version the app is developed with
          channel: stable
          cache: true

      - name: Use the runner's JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool packages/wobot_faces/lib

      # Fake values compile an APK but cannot authenticate or reach a backend.
      - name: Stand in for the Firebase config
        run: dart run tool/prepare_ci.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
